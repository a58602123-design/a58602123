name: 長輩查車品質檢查
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查 JavaScript
        run: |
          node --check elder.js
          node --check api/schedule.js
          node --check api/itineraries.js
          node --check api/taigi.js
      - name: 執行固定班次與轉乘測試
        run: node --test tests/*.test.js

      - name: 驗證已上線的台語音訊（僅指定檢查）
        if: contains(github.event.head_commit.message, '[verify-voice]')
        run: |
          sleep 30
          echo "=== 台語伺服器健康測試 ==="
          curl -sSL --max-time 45 -o /tmp/voice-health -w 'HTTP %{http_code} TYPE %{content_type}\n' "https://a58602123.vercel.app/api/taigi?check=health" || true
          head -c 700 /tmp/voice-health || true
          echo
          echo "=== 漢字轉台羅服務 ==="
          curl -sSL --max-time 45 -o /tmp/voice-phonetic -w 'HTTP %{http_code} TYPE %{content_type}\n' "https://a58602123.vercel.app/api/taigi?check=phonetic" || true
          head -c 700 /tmp/voice-phonetic || true
          echo
          echo "=== 免費台語MP3合成測試（一次） ==="
          curl -sSL --max-time 55 -o /tmp/voice-demo -w 'HTTP %{http_code} TYPE %{content_type}\n' "https://a58602123.vercel.app/api/taigi?check=1" || true
          head -c 700 /tmp/voice-demo || true
          echo

      - name: 線上驗證7111五班及真實轉乘台語音檔
        if: contains(github.event.head_commit.message, '[verify-trip-voice]')
        run: |
          sleep 35
          echo "=== 正式網站最新7111班次 ==="
          curl -fsSL --max-time 60 "https://a58602123.vercel.app/api/itineraries?date=2026-10-14&qa=$(date +%s)" -o /tmp/itineraries.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/itineraries.json','utf8'));
          for (const day of d.days) {
            console.log(day.date, d.version, day.bus7111?.home?.map(b=>b.dep), "可接高鐵", [...new Set(day.home?.map(x=>x.bus2.dep))]);
            if(day.date==='2026-10-14'){
              const b=day.bus7111?.home?.map(x=>x.dep);
              if(!Array.isArray(b)||b.length!==5||!b.includes('11:35')||!b.includes('18:20'))process.exitCode=1;
            }
          }
          NODE
          echo "=== 真正完整車次：1307 轉 7102A、7111 台語 MP3 ==="
          curl -sSL --max-time 110 -o /tmp/real-trip.mp3 -w 'HTTP %{http_code} TYPE %{content_type} BYTES %{size_download}\n'             'https://a58602123.vercel.app/api/taigi?dir=home&hsr=1307&hsrDep=08%3A50&hsrArr=10%3A16&bus1=7102A&bus1Dep=10%3A55&bus2=7111&bus2Dep=11%3A35&end=12%3A20'
          file /tmp/real-trip.mp3
          test "$(head -c3 /tmp/real-trip.mp3)" = 'ID3' || { head -c400 /tmp/real-trip.mp3; exit 1; }

      - name: 驗證台語三段短句全部是可播放 MP3
        if: contains(github.event.head_commit.message, '[verify-taigi-parts]')
        run: |
          sleep 35
          echo '=== 台語三段短句及車次 ==='
          curl -fsSL --max-time 25 'https://a58602123.vercel.app/api/taigi?check=segments&dir=home&hsr=1307&hsrDep=08%3A50&hsrArr=10%3A16&bus1=7102A&bus1Dep=10%3A55&bus2=7111&bus2Dep=11%3A35&end=12%3A20' -o /tmp/segments.json
          node - <<'NODE'
          const data=require('/tmp/segments.json');
          if(!data.ok||data.segments?.length!==3)process.exit(1);
          for(let i=0;i<3;i++){
            console.log('第'+(i+1)+'段: '+data.segments[i]);
            if(data.segments[i].length>36)process.exit(1);
          }
          NODE
          for part in 0 1 2; do
            echo "=== 音檔第 ${part} 段 ==="
            curl -sSL --max-time 70 -o "/tmp/taigi-${part}.mp3" -w 'HTTP %{http_code} TYPE %{content_type} BYTES %{size_download}\\n' \
              "https://a58602123.vercel.app/api/taigi?part=${part}&dir=home&hsr=1307&hsrDep=08%3A50&hsrArr=10%3A16&bus1=7102A&bus1Dep=10%3A55&bus2=7111&bus2Dep=11%3A35&end=12%3A20"
            file "/tmp/taigi-${part}.mp3"
            node -e "const fs=require('fs');const f=fs.readFileSync('/tmp/taigi-${part}.mp3');if(f.length<2500||f.subarray(0,3).toString()!=='ID3')throw Error('Not valid MP3');console.log('MP3 bytes',f.length)"
            if [ "$part" != '2' ]; then sleep 23; fi
          done

      - name: 驗證台語「十一點」拼音
        if: contains(github.event.head_commit.message, '[check-eleven]')
        run: |
          sleep 12
          curl -fsSL --max-time 40 'https://a58602123.vercel.app/api/taigi?check=eleven' -o /tmp/eleven.json
          cat /tmp/eleven.json
          echo


      - name: 驗證「十一點」台羅與新版真實 MP3
        if: contains(github.event.head_commit.message, '[test-time-v10]')
        run: |
          sleep 20
          echo '=== 十一點固定台羅 ==='
          curl -fsSL --max-time 25 'https://a58602123.vercel.app/api/taigi?check=eleven' -o /tmp/time11.json
          node - <<'NODE'
          const a=require('/tmp/time11.json');
          console.log(a);
          if(a.kip!=='tsa̍p-it tiám')process.exit(1);
          NODE
          echo '=== 真實轉乘音檔固定台羅 ==='
          curl -fsSL --max-time 25 'https://a58602123.vercel.app/api/taigi?check=romanization&dir=home&hsr=1307&hsrDep=08%3A50&hsrArr=10%3A16&bus1=7102A&bus1Dep=10%3A55&bus2=7111&bus2Dep=11%3A35&end=12%3A20' -o /tmp/romanization.json
          node - <<'NODE'
          const a=require('/tmp/romanization.json');
          console.log(a);
          if(!a.segments || a.segments.length!==3 || !a.segments[2].includes('tsa̍p-it tiám'))process.exit(1);
          NODE
          echo '=== 十一點 MP3 合成 ==='
          curl -sSL --max-time 55 -w 'HTTP %{http_code} TYPE %{content_type} SIZE %{size_download}\n' -o /tmp/time11.mp3 'https://a58602123.vercel.app/api/taigi?check=elevenAudio'
          file /tmp/time11.mp3
          node -e "const f=require('fs').readFileSync('/tmp/time11.mp3');if(f.subarray(0,3).toString()!=='ID3')throw new Error('Eleven MP3 failed: '+f.toString().slice(0,300));console.log('eleven MP3 bytes',f.length)"
          sleep 25
          echo '=== 完整轉乘中的十一點三十五分 MP3 ==='
          curl -sSL --max-time 55 -w 'HTTP %{http_code} TYPE %{content_type} SIZE %{size_download}\n' -o /tmp/bus11.mp3 'https://a58602123.vercel.app/api/taigi?v=10&part=2&dir=home&hsr=1307&hsrDep=08%3A50&hsrArr=10%3A16&bus1=7102A&bus1Dep=10%3A55&bus2=7111&bus2Dep=11%3A35&end=12%3A20'
          file /tmp/bus11.mp3
          node -e "const f=require('fs').readFileSync('/tmp/bus11.mp3');if(f.subarray(0,3).toString()!=='ID3')throw new Error('Trip MP3 failed: '+f.toString().slice(0,300));console.log('trip MP3 bytes',f.length)"


      - name: 驗證正式網站 10月16日高鐵班次與轉乘風險
        if: contains(github.event.head_commit.message, '[verify-rail-20261016]')
        run: |
          sleep 28
          echo '檢查正式網站與 10月16日雲林往南港的表定高鐵'
          curl -fsSL --max-time 70 -o /tmp/rail.json 'https://a58602123.vercel.app/api/itineraries?date=2026-10-16'
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/rail.json','utf8'));
          const day=d.days.find(x=>x.date==='2026-10-16');
          if(!day)throw Error('missing requested date');
          const table=day.thsr?.north||[];
          const expected=[['814','10:12','11:50'],['818','11:12','12:50'],['822','12:12','13:50'],['826','13:12','14:50']];
          for(const [no,dep,arr] of expected){
            if(!table.some(x=>x.no===no&&x.dep===dep&&x.arr===arr))throw Error('missing official HSR '+no+' '+dep);
          }
          const bus=(day.train||[]).filter(x=>x.bus1.route.startsWith('7111')&&x.bus2.route.startsWith('7102B'));
          const maybe=bus.find(x=>x.hsr.no==='818'&&x.bus2.arr==='10:46');
          const safe=bus.find(x=>x.hsr.no==='822'&&x.bus2.arr==='10:46');
          if(!maybe||!maybe.transferRisk||maybe.wait2!==26)throw Error('818 should show 26min transfer risk');
          if(!safe||safe.transferRisk||safe.wait2!==86)throw Error('822 should show 86min safe connection');
          console.log('正式 API 版本:',d.version);
          console.log('全部高鐵:',expected);
          console.log('818:',maybe.hsr.dep,'轉乘僅',maybe.wait2,'分，風險標示',maybe.transferRisk);
          console.log('822:',safe.hsr.dep,'轉乘',safe.wait2,'分，風險標示',safe.transferRisk);
          NODE
          curl -fsSL --max-time 20 'https://a58602123.vercel.app/?check=v12' -o /tmp/main.html
          grep -q 'id="thsrTimetable"' /tmp/main.html
          grep -q '/elder.js?v=12' /tmp/main.html
          curl -fsSL --max-time 20 'https://a58602123.vercel.app/elder.js?v=12' -o /tmp/app.js
          grep -q 'transferRisk' /tmp/app.js
          grep -q 'railGrid' /tmp/app.js
          echo '正式頁面 v12 和轉乘風險顯示腳本均正常'
